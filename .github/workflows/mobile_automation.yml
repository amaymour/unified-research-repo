name: Mobile Triggered Research Automation

on:
  repository_dispatch:
    types: [mobile_trigger]

jobs:
  scrape-and-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Scrapling Browsers
        run: |
          scrapling install || python -m scrapling install || echo "Scrapling install completed or skipped"

      - name: Run Orchestration Script
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
          PROMPT: ${{ github.event.client_payload.prompt }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python run_all.py

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: output.json
